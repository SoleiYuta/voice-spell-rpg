name: Sync phase progress

# 「フェーズが進む」= issue/マイルストーン状態の変化で発火し、
# README.md と wiki/hot.md の進捗ブロックを自動更新してコミットする。
# （push では発火しない＝自動コミットによる無限ループを防止）

on:
  issues:
    types: [closed, reopened, milestoned, demilestoned]
  milestone:
    types: [closed, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# 同時実行を1本に絞る（連続クローズでの競合コミットを防ぐ）
concurrency:
  group: sync-progress
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Update progress blocks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/sync-progress.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md wiki/hot.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md wiki/hot.md
            git commit -m "chore(docs): sync phase progress [skip ci]"
            git push origin develop
          else
            echo "No changes to commit."
          fi
